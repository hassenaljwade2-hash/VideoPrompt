plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videoprompt.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.videoprompt.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // يوقّع بمفتاح الـ debug حتى يتنصّب مباشرة على التلفون
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
